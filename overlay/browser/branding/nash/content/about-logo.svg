<!-- Mark Nash, piste « Sillage » (prototype/logo-pistes.html, tools/make-icon.py). -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151A33"/>
      <stop offset="1" stop-color="#07090F"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#3B4BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3B4BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EE7FF"/>
      <stop offset="0.55" stop-color="#7C6CFF"/>
      <stop offset="1" stop-color="#FF6FB5"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6FF"/>
      <stop offset="1" stop-color="#B9C1DA"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>
  <rect x="9" y="9" width="82" height="82" rx="18.5" fill="url(#night)"/>
  <rect x="9" y="9" width="82" height="82" rx="18.5" fill="url(#halo)"/>
  <rect x="9.5" y="9.5" width="81" height="81" rx="18" fill="none" stroke="#fff" stroke-opacity="0.10"/>
  <polygon points="29,27 40,27 71,73 60,73" fill="url(#beam)" filter="url(#glow)" opacity="0.9"/>
  <rect x="29" y="27" width="11" height="46" rx="2.5" fill="url(#stem)"/>
  <rect x="60" y="27" width="11" height="46" rx="2.5" fill="url(#stem)"/>
  <polygon points="29,27 40,27 71,73 60,73" fill="url(#beam)"/>
</svg>
